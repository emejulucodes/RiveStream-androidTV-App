name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref. Releases are
# numbered from the run number, so letting stale runs finish would publish
# out-of-order versions.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.8"
  JAVA_VERSION: "17"

jobs:
  # ---------------------------------------------------------------------
  # Gate. Nothing is published unless this passes.
  # ---------------------------------------------------------------------
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # ---------------------------------------------------------------------
  # Build and publish. Skipped for pull requests.
  # ---------------------------------------------------------------------
  release:
    name: Build APK & publish release
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release and upload the APK

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # flutter_inappwebview_android 1.1.3 calls
      # getDefaultProguardFile('proguard-android.txt'), which AGP 9 rejects
      # because it implies -dontoptimize. Without this the release build fails
      # outright. Version-globbed so a dependency bump does not silently skip
      # the patch; if the package is gone the warning says so rather than
      # failing a build that no longer needs it.
      - name: Patch flutter_inappwebview_android for AGP 9
        run: |
          set -euo pipefail
          shopt -s nullglob
          patched=0
          for f in "$HOME"/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-*/android/build.gradle; do
            sed -i "s/getDefaultProguardFile('proguard-android.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" "$f"
            echo "patched $f"
            patched=1
          done
          if [ "$patched" -eq 0 ]; then
            echo "::warning::flutter_inappwebview_android not found in pub cache; AGP 9 patch skipped"
          fi

      # Version is <major>.<minor> from pubspec.yaml plus the run number, so
      # every push to main produces a strictly increasing version and a unique
      # tag. The run number is also the Android versionCode, which must
      # increase monotonically for installs to be treated as upgrades.
      # Bump major/minor in pubspec.yaml to start a new series.
      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          BASE=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | cut -d'+' -f1)
          MAJOR_MINOR=$(echo "$BASE" | cut -d. -f1,2)
          VERSION="${MAJOR_MINOR}.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION (code ${{ github.run_number }})"

      # Signs with a real keystore when the secrets are present. Without them
      # the build falls back to a debug key that is regenerated on every
      # runner, so consecutive releases cannot be installed over each other.
      # That is a warning rather than an error so the workflow is useful
      # immediately, before any secrets are configured.
      - name: Configure signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release-keystore.jks\n' \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore configured."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret set. The APK will be signed with an ephemeral debug key and cannot be installed as an upgrade over another release."
          fi

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ github.run_number }}"

      - name: Name the artifact
        id: artifact
        run: |
          set -euo pipefail
          SRC=build/app/outputs/flutter-apk/app-release.apk
          DEST="build/app/outputs/flutter-apk/RiveStream-${{ steps.version.outputs.tag }}.apk"
          mv "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$DEST" | cut -f1)" >> "$GITHUB_OUTPUT"

      # Keeps the APK retrievable even if the release step fails.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiveStream-${{ steps.version.outputs.tag }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      - name: Write release notes
        run: |
          set -euo pipefail
          {
            echo "Android TV build of RiveStream."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${{ steps.version.outputs.version }}\` |"
            echo "| Version code | \`${{ github.run_number }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Size | ${{ steps.artifact.outputs.size }} |"
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "adb install -r RiveStream-${{ steps.version.outputs.tag }}.apk"
            echo '```'
            if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
              echo
              echo "> **Signed with a debug key.** No release keystore is configured for this"
              echo "> repository, and the debug key is regenerated on every CI runner. Installing"
              echo "> this build over a previous release will fail with a signature mismatch --"
              echo "> uninstall the old version first. See the README for how to configure signing."
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.artifact.outputs.path }}" \
            --title "RiveStream ${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md
